<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单卦表格目录 · 重读易经</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            color: #e8e8e8;
            line-height: 1.8;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* 头部 */
        .hero {
            text-align: center;
            padding: 50px 30px;
            background: linear-gradient(135deg, rgba(217, 119, 6, 0.12) 0%, rgba(30, 41, 59, 0.3) 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(217, 119, 6, 0.3);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.06) 0%, transparent 70%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .back-link {
            display: inline-block;
            color: #d97706;
            text-decoration: none;
            font-size: 0.95em;
            margin-bottom: 12px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #f0f0f0;
        }

        .hero h1 {
            font-size: 2em;
            color: #d97706;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .hero .subtitle {
            font-size: 1em;
            color: #a0a0a0;
            font-style: italic;
        }

        /* 搜索 */
        .search-box {
            margin-bottom: 24px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            font-size: 0.95em;
            font-family: inherit;
            color: #f0f0f0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .search-box input::placeholder {
            color: #888;
        }

        .search-box input:focus {
            border-color: rgba(217, 119, 6, 0.5);
            background: rgba(255, 255, 255, 0.07);
        }

        .search-box .icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1em;
        }

        .stats {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 16px;
        }

        /* 视图切换 */
        .view-switch {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .view-switch a {
            color: #a0a0a0;
            text-decoration: none;
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .view-switch a:hover {
            border-color: rgba(217, 119, 6, 0.4);
            color: #f0f0f0;
        }

        .view-switch a.active {
            background: rgba(217, 119, 6, 0.15);
            border-color: rgba(217, 119, 6, 0.4);
            color: #f0f0f0;
        }

        /* 表格 */
        .table-wrap {
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        thead {
            background: rgba(217, 119, 6, 0.12);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #d97706;
            border-bottom: 1px solid rgba(217, 119, 6, 0.25);
            white-space: nowrap;
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
        }

        th.sortable:hover {
            background: rgba(217, 119, 6, 0.18);
        }

        th .sort-indicator {
            margin-left: 6px;
            color: #888;
            font-size: 0.85em;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s ease;
            cursor: pointer;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        tbody tr.hidden {
            display: none;
        }

        td {
            padding: 12px 16px;
            vertical-align: top;
        }

        td.number {
            color: #d97706;
            font-weight: 600;
            white-space: nowrap;
            width: 60px;
        }

        td.name {
            color: #f0f0f0;
            font-weight: 600;
            white-space: nowrap;
            width: 140px;
        }

        td.hexagram {
            color: #c9c9c9;
            white-space: nowrap;
            font-size: 1.1em;
            width: 80px;
        }

        td.statement {
            color: #a0a0a0;
            font-size: 0.92em;
        }

        td.keywords {
            color: #888;
            font-size: 0.88em;
        }

        td.keywords .tag {
            display: inline-block;
            background: rgba(217, 119, 6, 0.12);
            border: 1px solid rgba(217, 119, 6, 0.25);
            color: #c9c9c9;
            padding: 2px 8px;
            border-radius: 12px;
            margin: 2px 4px 2px 0;
            font-size: 0.85em;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 40px;
            font-style: italic;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #666;
            font-size: 0.9em;
        }

        .footer a {
            color: #d97706;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .hero { padding: 40px 20px; }
            .hero h1 { font-size: 1.6em; }
            th, td { padding: 10px 12px; }
            td.name { width: auto; }
            td.hexagram { display: none; }
            th:nth-child(3), td:nth-child(3) { display: none; }
        }
    </style>
</head>

        <div class="footer">

            { num: 49, name: "革卦：泽火革", hex: "☱☲", stmt: "己日乃孚，元亨利贞，悔亡。", file: "49-ge.html", kw: ["泽火革", "革故鼎新", "顺天应人", "大人虎变"] },

            { num: 51, name: "震卦：震为雷", hex: "☳☳", stmt: "亨。震来虩虩，笑言哑哑。震惊百里，不丧匕鬯。", file: "51-zhen.html", kw: ["震为雷", "震惧修省", "洊雷振民", "不丧匕鬯"] },
            { num: 52, name: "艮卦：艮为山", hex: "☶☶", stmt: "艮其背，不获其身，行其庭，不见其人，无咎。", file: "52-gen.html", kw: ["艮为山", "止其所止", "思不出位", "敦艮"] },
            { num: 53, name: "渐卦：风山渐", hex: "☴☶", stmt: "女归吉，利贞。", file: "53-jian.html", kw: ["风山渐", "渐进之道", "女归吉", "居贤德善俗"] },
            { num: 54, name: "归妹卦：雷泽归妹", hex: "☳☱", stmt: "征凶，无攸利。", file: "54-guimei.html", kw: ["雷泽归妹", "归妹之时", "永终知敝", "帝乙归妹"] },
            { num: 55, name: "丰卦：雷火丰", hex: "☳☲", stmt: "亨，王假之，勿忧，宜日中。", file: "55-feng.html", kw: ["雷火丰", "丰大之时", "折狱致刑", "日中见斗"] },
            { num: 56, name: "旅卦：火山旅", hex: "☲☶", stmt: "小亨，旅贞吉。", file: "56-lv.html", kw: ["火山旅", "行旅之道", "柔中守正", "明慎用刑"] },
            { num: 57, name: "巽卦：巽为风", hex: "☴☴", stmt: "小亨，利有攸往，利见大人。", file: "57-xun.html", kw: ["巽为风", "巽顺之道", "申命行事", "先庚后庚"] },
            { num: 58, name: "兑卦：兑为泽", hex: "☱☱", stmt: "亨，利贞。", file: "58-dui.html", kw: ["兑为泽", "兑悦之道", "朋友说习", "刚中柔外"] },
            { num: 59, name: "涣卦：风水涣", hex: "☴☵", stmt: "亨。王假有庙，利涉大川，利贞。", file: "59-huan.html", kw: ["风水涣", "涣散之时", "立庙聚心", "涣群就公"] },
            { num: 60, name: "节卦：水泽节", hex: "☵☱", stmt: "亨。苦节不可贞。", file: "60-jie.html", kw: ["水泽节", "节止之道", "制数度议德行", "甘节"] },
            { num: 61, name: "中孚卦：风泽中孚", hex: "☴☱", stmt: "豚鱼吉，利涉大川，利贞。", file: "61-zhongfu.html", kw: ["风泽中孚", "诚信之道", "议狱缓死", "鸣鹤在阴"] },
            { num: 62, name: "小过卦：雷山小过", hex: "☳☶", stmt: "亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。", file: "62-xiaoguo.html", kw: ["雷山小过", "小有过越", "行过乎恭", "飞鸟遗音"] },
            { num: 63, name: "既济卦：水火既济", hex: "☵☲", stmt: "亨，小利贞，初吉终乱。", file: "63-jiji.html", kw: ["水火既济", "已成之功", "思患预防", "初吉终乱"] },
            { num: 64, name: "未济卦：火水未济", hex: "☲☵", stmt: "亨，小狐汔济，濡其尾，无攸利。", file: "64-weiji.html", kw: ["火水未济", "未成之终", "慎辨物居方", "小狐汔济"] }
        ];

        const tbody = document.getElementById('table-body');
        const searchInput = document.getElementById('search');
        const stats = document.getElementById('stats');
        const empty = document.getElementById('empty');
        const table = document.getElementById('hexagram-table');

        function renderTable(data) {
            tbody.innerHTML = '';
            data.forEach(h => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-keywords', (h.name + ' ' + h.stmt + ' ' + h.kw.join(' ')).toLowerCase());
                tr.onclick = () => window.location.href = h.file;
                tr.innerHTML = `
                    <td class="number">${String(h.num).padStart(2, '0')}</td>
                    <td class="name">${h.name}</td>
                    <td class="hexagram">${h.hex}</td>
                    <td class="statement">${h.stmt}</td>
                    <td class="keywords">${h.kw.map(k => `<span class="tag">${k}</span>`).join('')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable(hexagrams);

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            const rows = tbody.querySelectorAll('tr');
            let visible = 0;

            rows.forEach(row => {
                if (row.dataset.keywords.includes(query)) {
                    row.classList.remove('hidden');
                    visible++;
                } else {
                    row.classList.add('hidden');
                }
            });

            stats.textContent = query ? `找到 ${visible} 卦` : '共 64 卦';
            empty.classList.toggle('hidden', visible > 0);
        });

        // 表头排序
        let sortDir = { number: 1, name: 1 };
        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', function() {
                const col = this.dataset.col;
                sortDir[col] *= -1;
                const sorted = [...hexagrams].sort((a, b) => {
                    let va = col === 'number' ? a.num : a.name;
                    let vb = col === 'number' ? b.num : b.name;
                    if (va < vb) return -sortDir[col];
                    if (va > vb) return sortDir[col];
                    return 0;
                });
                renderTable(sorted);
                searchInput.value = '';
                stats.textContent = '共 64 卦';
                empty.classList.add('hidden');

                document.querySelectorAll('th.sortable .sort-indicator').forEach(si => si.textContent = '⇅');
                this.querySelector('.sort-indicator').textContent = sortDir[col] === 1 ? '↑' : '↓';
            });
        });
    </script>
</body>
